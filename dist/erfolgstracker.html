<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Erfolgstracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232f7d5a'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
:root {
  --bg: #f4f5f2;
  --surface: #ffffff;
  --surface-2: #eef0ea;
  --text: #1c2420;
  --muted: #6b746e;
  --border: #dfe3dc;
  --accent: #2f7d5a;
  --accent-soft: #d9efe3;
  --warn: #b7791f;
  --danger: #b4423b;
  --info: #3b6ea8;
  --purple: #6d4fb0;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.04);
  --radius: 14px;
  --heat-0: #e6e9e2; --heat-1: #bfe3cf; --heat-2: #7fc7a1; --heat-3: #3f9f72; --heat-4: #1f6b4a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121614; --surface: #1b211d; --surface-2: #232b26; --text: #e7ebe6; --muted: #98a19b;
    --border: #2d3630; --accent: #5cc08f; --accent-soft: #1f3a2d; --warn: #e0a84a; --danger: #e06b63; --info: #7aa7e0; --purple: #a68ae6;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    --heat-0: #232b26; --heat-1: #1f4a35; --heat-2: #2a6e4c; --heat-3: #3f9f72; --heat-4: #7fdcae;
  }
}
:root[data-theme="dark"] {
  --bg: #121614; --surface: #1b211d; --surface-2: #232b26; --text: #e7ebe6; --muted: #98a19b;
  --border: #2d3630; --accent: #5cc08f; --accent-soft: #1f3a2d; --warn: #e0a84a; --danger: #e06b63; --info: #7aa7e0; --purple: #a68ae6;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  --heat-0: #232b26; --heat-1: #1f4a35; --heat-2: #2a6e4c; --heat-3: #3f9f72; --heat-4: #7fdcae;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
h2 { font-size: 1.25rem; }
h3 { font-size: .95rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }

.top {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.brand { font-weight: 700; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
.logo { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 15px; }
nav { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
nav a { padding: 6px 11px; border-radius: 999px; color: var(--muted); font-weight: 500; }
nav a:hover { background: var(--surface-2); color: var(--text); }
nav a.active { background: var(--accent-soft); color: var(--accent); }
.mode { font-size: .75rem; color: var(--muted); padding: 3px 9px; border: 1px solid var(--border); border-radius: 999px; }
.mode.local { border-color: var(--warn); color: var(--warn); }

.view { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.page-head p { margin: 4px 0 0; }

.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px; box-shadow: var(--shadow); min-width: 0;
}
.card.wide { grid-column: 1 / -1; }
.card h3 { margin-bottom: 8px; }
.kpi { font-size: 2rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.kpi small { font-size: 1rem; color: var(--muted); font-weight: 500; }
.sub { color: var(--muted); font-size: .85rem; margin-top: 4px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: grid; gap: 10px; }

.progress { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-top: 10px; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s; }
.progress.warn > i { background: var(--warn); }

.badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .75rem; font-weight: 600; background: var(--surface-2); color: var(--muted); }
.badge.uni { background: #e3ecfa; color: #2d5c9e; } .badge.praktikum { background: #efe6fb; color: #5d3fa3; }
.badge.sidehustle { background: #fbeedb; color: #9a6410; } .badge.fitness, .badge.workout { background: var(--accent-soft); color: var(--accent); }
.badge.finanzen { background: #e5f2f0; color: #1f6f66; } .badge.persoenlich { background: #f6e6e6; color: #9a3f3a; }
.badge.checkin { background: #fbeedb; color: #9a6410; } .badge.milestone { background: #efe6fb; color: #5d3fa3; } .badge.session { background: #e3ecfa; color: #2d5c9e; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge { filter: brightness(.85) saturate(1.1); } }

button, .btn {
  font: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--surface);
  color: var(--text); padding: 8px 14px; border-radius: 10px; font-weight: 600; line-height: 1.2;
}
button:hover, .btn:hover { background: var(--surface-2); }
button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { filter: brightness(1.08); }
button.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 4px 8px; }
button.ghost:hover { color: var(--danger); background: transparent; }
button.sm { padding: 5px 10px; font-size: .85rem; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 18px; }

form.inline { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); align-items: end; }
form.inline .full { grid-column: 1 / -1; }
label { display: grid; gap: 4px; font-size: .8rem; color: var(--muted); font-weight: 600; }
input, select, textarea {
  font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 10px; width: 100%; min-width: 0;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
textarea { resize: vertical; min-height: 60px; }
input[type="checkbox"] { width: auto; }
.check { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--text); font-weight: 500; padding: 8px 0; }

/* Schnellumfrage */
.survey { display: grid; gap: 14px; }
.survey .q { display: grid; gap: 6px; }
.survey .q span.lbl { font-weight: 600; font-size: .9rem; }
.choices { display: flex; gap: 6px; flex-wrap: wrap; }
.choices button { padding: 10px 14px; border-radius: 12px; min-width: 52px; }
.choices button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.stepper { display: inline-flex; align-items: center; gap: 10px; }
.stepper button { width: 42px; height: 42px; border-radius: 50%; padding: 0; font-size: 1.2rem; }
.stepper b { min-width: 2ch; text-align: center; font-size: 1.3rem; }

.thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); vertical-align: middle; background: var(--surface-2); }
.thumb.sm { width: 32px; height: 32px; border-radius: 6px; }
.pick { cursor: pointer; }
.pick input { display: none; }
.pick span { display: inline-grid; place-items: center; min-width: 52px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 12px; font-weight: 600; background: var(--surface); color: var(--text); }
.pick span small { font-weight: 500; font-size: .7rem; color: var(--muted); }
.pick input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; }
.pick input:checked + span small { color: #fff; opacity: .85; }
.q { display: grid; gap: 6px; } .q .lbl { font-weight: 600; font-size: .9rem; }

table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
tr.done td { color: var(--muted); }
tr.done td .title { text-decoration: line-through; }
.table-wrap { overflow-x: auto; }

.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.feed li { display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--border); }
.feed li:last-child { border-bottom: 0; }
.feed .date { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
.feed .pts { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }

.empty { padding: 18px; border: 1px dashed var(--border); border-radius: 12px; color: var(--muted); text-align: center; font-size: .9rem; }
.hint { background: var(--accent-soft); color: var(--accent); padding: 10px 14px; border-radius: 12px; font-size: .9rem; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .78rem; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

svg.chart { width: 100%; max-width: 640px; height: auto; display: block; }
svg.chart text { fill: var(--muted); font-size: 10px; }
.heat rect { rx: 2; }
.heat .l0 { fill: var(--heat-0); } .heat .l1 { fill: var(--heat-1); } .heat .l2 { fill: var(--heat-2); } .heat .l3 { fill: var(--heat-3); } .heat .l4 { fill: var(--heat-4); }
.bar { fill: var(--accent); } .bar.dim { fill: var(--heat-1); } .bar.today { fill: var(--info); }
.line { fill: none; stroke: var(--warn); stroke-width: 2; } .dot { fill: var(--warn); }
.goal { stroke: var(--muted); stroke-dasharray: 3 3; stroke-width: 1; }
.hbar-bg { fill: var(--surface-2); } .hbar { fill: var(--accent); } .hbar.alt { fill: var(--info); }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: .9rem;
  box-shadow: var(--shadow); z-index: 50;
}
.toast.error { background: var(--danger); color: #fff; }
kbd, code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85em; background: var(--surface-2); padding: 1px 6px; border-radius: 6px; }
pre { background: var(--surface-2); padding: 12px; border-radius: 10px; overflow-x: auto; font-size: .82rem; }

@media (max-width: 640px) {
  .top { padding: 8px 12px; gap: 8px; }
  nav a { padding: 6px 9px; font-size: .9rem; }
  .mode { font-size: .7rem; }
  .view { padding: 14px 12px 50px; }
  .kpi { font-size: 1.7rem; }
  .feed li { grid-template-columns: 48px 1fr auto; }
}
@media (max-width: 640px) {
  .brand { width: 100%; }
}

</style>
</head>
<body>
  <header class="top">
    <a class="brand" href="#dashboard"><span class="logo">✓</span> Erfolgstracker</a>
    <nav id="nav">
      <a href="#dashboard" data-view="dashboard">Übersicht</a>
      <a href="#workouts" data-view="workouts">Workouts</a>
      <a href="#essen" data-view="essen">Essen</a>
      <a href="#meilensteine" data-view="meilensteine">Meilensteine</a>
      <a href="#finanzen" data-view="finanzen">Finanzen</a>
      <a href="#sessions" data-view="sessions">Sessions</a>
      <a href="#woche" data-view="woche">Woche</a>
      <a href="#einstellungen" data-view="einstellungen">⚙︎</a>
    </nav>
    <span id="mode" class="mode" title="Speicherort der Daten"></span>
  </header>
  <main id="view" class="view"><p class="muted">Lade…</p></main>
  <div id="toast" class="toast" hidden></div>
  <script>
/* Gemeinsame Auswertungslogik für Browser (window.Stats) und Node (require).
   Keine Abhängigkeiten. Alle Datumswerte sind lokale Strings "YYYY-MM-DD". */
(function (root, factory) {
  const api = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Stats = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ---------- Datum ----------
  const pad = (n) => String(n).padStart(2, '0');
  function localDate(d = new Date()) {
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  function parse(s) {
    const [y, m, d] = String(s).slice(0, 10).split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function addDays(s, n) { const d = parse(s); d.setDate(d.getDate() + n); return localDate(d); }
  function startOfWeek(s) { const d = parse(s); const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); return localDate(d); }
  function monthKey(s) { return String(s).slice(0, 7); }
  function daysBetween(a, b) { return Math.round((parse(b) - parse(a)) / 86400000); }
  function fmtDate(s) {
    if (!s) return '';
    const d = parse(s);
    return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`;
  }
  function isoWeek(s) {
    const d = parse(s); d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
    const week1 = new Date(d.getFullYear(), 0, 4);
    return 1 + Math.round(((d - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
  }
  // Wochen-Check: fällig für die letzte abgeschlossene Woche, ab Freitag auch für die laufende.
  function reviewStatus(reviews, today) {
    const weeks = new Set((reviews || []).map((r) => r.weekStart || startOfWeek(r.date)));
    const thisWeek = startOfWeek(today), lastWeek = addDays(thisWeek, -7);
    const dow = (parse(today).getDay() + 6) % 7; // 0 = Montag
    let due = null;
    if (!weeks.has(lastWeek) && (reviews || []).length) due = lastWeek;
    if (dow >= 4 && !weeks.has(thisWeek)) due = thisWeek;
    if (!(reviews || []).length && dow >= 4) due = thisWeek;
    return { due, thisWeekDone: weeks.has(thisWeek), lastWeekDone: weeks.has(lastWeek) };
  }
  function fmtDateShort(s) { const d = parse(s); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.`; }

  // ---------- Labels ----------
  const CATEGORIES = {
    uni: 'Uni', praktikum: 'Praktikum', sidehustle: 'Sidehustle', fitness: 'Fitness',
    finanzen: 'Finanzen', persoenlich: 'Persönlich',
  };
  const INTERVALS = { monthly: 'monatlich', quarterly: 'vierteljährlich', yearly: 'jährlich', weekly: 'wöchentlich' };
  const WORKOUT_TYPES = ['Kraft', 'Cardio', 'Laufen', 'Rad', 'Schwimmen', 'Mobility', 'Sport', 'Sonstiges'];
  const EXPENSE_CATEGORIES = ['Essen', 'Freizeit', 'Mobilität', 'Kleidung', 'Gesundheit', 'Bildung', 'Sonstiges'];

  // ---------- Punkte & Level ----------
  const LEVELS = [
    { min: 0, name: 'Start' }, { min: 100, name: 'Anlauf' }, { min: 250, name: 'Routine' },
    { min: 500, name: 'Momentum' }, { min: 850, name: 'Disziplin' }, { min: 1300, name: 'Fokus' },
    { min: 1900, name: 'Flow' }, { min: 2600, name: 'Ausdauer' }, { min: 3500, name: 'Meister' },
    { min: 4600, name: 'Legende' }, { min: 6000, name: 'Unaufhaltsam' },
  ];

  function workoutPoints(w) { return 10 + Math.min(30, Math.round((Number(w.minutes) || 0) / 5)); }
  function checkinPoints(c, settings) { return 5 + (eatingScore(c, settings) >= 7 ? 3 : 0); }
  function milestonePoints(m) {
    if (!m.done) return 0;
    const base = { uni: 60, praktikum: 100, sidehustle: 60, finanzen: 40, fitness: 40, persoenlich: 40 }[m.category] || 40;
    const g = Number(m.grade);
    let bonus = 0;
    if (m.grade !== undefined && m.grade !== null && m.grade !== '' && !Number.isNaN(g)) {
      if (g <= 1.5) bonus = 40; else if (g <= 2.0) bonus = 25; else if (g <= 2.5) bonus = 10;
    }
    return base + bonus;
  }
  function sessionPoints(s) { const p = Number(s.points); return Number.isFinite(p) ? p : 15; }
  function reviewPoints(r) { const p = Number(r.points); return Number.isFinite(p) ? p : 20; }

  function points(data) {
    const settings = data.settings || {};
    const by = {
      workouts: (data.workouts || []).reduce((a, w) => a + workoutPoints(w), 0),
      checkins: (data.checkins || []).reduce((a, c) => a + checkinPoints(c, settings), 0),
      milestones: (data.milestones || []).reduce((a, m) => a + milestonePoints(m), 0),
      sessions: (data.sessions || []).reduce((a, s) => a + sessionPoints(s), 0),
      reviews: (data.reviews || []).reduce((a, r) => a + reviewPoints(r), 0),
    };
    const total = Object.values(by).reduce((a, b) => a + b, 0);
    return { total, by };
  }

  function level(total) {
    let idx = 0;
    for (let i = 0; i < LEVELS.length; i++) if (total >= LEVELS[i].min) idx = i;
    const cur = LEVELS[idx];
    const next = LEVELS[idx + 1] || null;
    const progress = next ? (total - cur.min) / (next.min - cur.min) : 1;
    return { number: idx + 1, name: cur.name, min: cur.min, next: next ? next.min : null, progress };
  }

  // ---------- Workouts ----------
  function workoutsInWeek(workouts, weekStart) {
    return (workouts || []).filter((w) => startOfWeek(w.date) === weekStart);
  }
  function weeklyGoalStreak(workouts, goal, today) {
    goal = Number(goal) || 0;
    if (!goal) return 0;
    const counts = {};
    for (const w of workouts || []) { const k = startOfWeek(w.date); counts[k] = (counts[k] || 0) + 1; }
    let week = startOfWeek(today);
    let streak = 0;
    if ((counts[week] || 0) < goal) week = addDays(week, -7); // laufende Woche zählt noch nicht gegen dich
    while ((counts[week] || 0) >= goal) { streak++; week = addDays(week, -7); }
    return streak;
  }
  function weeklyWorkoutSeries(workouts, today, weeks = 8) {
    const out = [];
    let week = startOfWeek(today);
    for (let i = 0; i < weeks; i++) {
      const list = workoutsInWeek(workouts, week);
      out.unshift({ week, count: list.length, minutes: list.reduce((a, w) => a + (Number(w.minutes) || 0), 0) });
      week = addDays(week, -7);
    }
    return out;
  }

  // ---------- Essen ----------
  // 0–10 Punkte pro Check-in: Mahlzeitenqualität 0–4, Gemüse 2, Snacks 0–2, Wasser 1, kein Alkohol 1
  function eatingScore(c, settings = {}) {
    const waterGoal = Number(settings.dailyWaterGoal) || 6;
    let s = 0;
    const meals = Number(c.meals);
    if (meals >= 1 && meals <= 5) s += meals - 1;
    if (c.veggies) s += 2;
    const snacks = Number(c.snacks);
    if (snacks === 0) s += 2; else if (snacks === 1) s += 1;
    if ((Number(c.water) || 0) >= waterGoal) s += 1;
    if (!c.alcohol) s += 1;
    return s;
  }
  function dayStreak(dates, today) {
    const set = new Set(dates);
    let d = today;
    if (!set.has(d)) d = addDays(d, -1);
    let n = 0;
    while (set.has(d)) { n++; d = addDays(d, -1); }
    return n;
  }
  function checkinSeries(checkins, settings, today, days = 14) {
    const byDate = {};
    for (const c of checkins || []) byDate[c.date] = c; // letzter Check-in des Tages gewinnt
    const out = [];
    for (let i = days - 1; i >= 0; i--) {
      const date = addDays(today, -i);
      const c = byDate[date];
      out.push({ date, score: c ? eatingScore(c, settings) : null });
    }
    return out;
  }
  function average(nums) {
    const xs = nums.filter((n) => typeof n === 'number' && !Number.isNaN(n));
    return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
  }

  // ---------- Meilensteine ----------
  function uniAverage(milestones) {
    let sum = 0, weight = 0, n = 0;
    for (const m of milestones || []) {
      if (m.category !== 'uni' || !m.done) continue;
      const g = Number(m.grade);
      if (!Number.isFinite(g) || m.grade === '' || m.grade === null || m.grade === undefined) continue;
      const w = Number(m.ects) > 0 ? Number(m.ects) : 1;
      sum += g * w; weight += w; n++;
    }
    return n ? { average: sum / weight, ects: weight, count: n } : null;
  }
  function openMilestones(milestones) {
    return (milestones || []).filter((m) => !m.done)
      .sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999'));
  }

  // ---------- Finanzen ----------
  function monthlyAmount(amount, interval) {
    const a = Number(amount) || 0;
    switch (interval) {
      case 'yearly': return a / 12;
      case 'quarterly': return a / 4;
      case 'weekly': return (a * 52) / 12;
      default: return a;
    }
  }
  function financeSummary(finances, today) {
    const f = finances || {};
    const month = monthKey(today);
    const fixedMonthly = (f.fixedCosts || []).reduce((a, c) => a + monthlyAmount(c.amount, c.interval), 0);
    const incomeMonthly = (f.income || []).reduce((a, c) => a + monthlyAmount(c.amount, c.interval), 0);
    const expensesMonth = (f.expenses || []).filter((e) => monthKey(e.date) === month);
    const variableMonth = expensesMonth.reduce((a, e) => a + (Number(e.amount) || 0), 0);
    const free = incomeMonthly - fixedMonthly - variableMonth;
    const savings = f.savings || { target: 0, current: 0 };
    const savingsPct = Number(savings.target) > 0 ? Math.min(1, (Number(savings.current) || 0) / Number(savings.target)) : null;
    const byCategory = {};
    for (const e of expensesMonth) byCategory[e.category || 'Sonstiges'] = (byCategory[e.category || 'Sonstiges'] || 0) + (Number(e.amount) || 0);
    return { month, fixedMonthly, incomeMonthly, variableMonth, free, savingsPct, byCategory, expensesMonth, upcoming: upcoming(f, today, 14) };
  }
  // Nächste Abbuchungen/Eingänge in den kommenden Tagen (Feld day = Tag im Monat; quarterly/yearly zählen wie monatlich, wenn kein Startmonat bekannt ist)
  function upcoming(finances, today, days = 14) {
    const out = [];
    const t = parse(today);
    const push = (item, kind) => {
      const day = Number(item.day);
      if (!day || day < 1 || day > 31) return;
      for (let m = 0; m <= 1; m++) {
        const d = new Date(t.getFullYear(), t.getMonth() + m, 1);
        const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
        d.setDate(Math.min(day, last));
        const ds = localDate(d);
        const diff = daysBetween(today, ds);
        if (diff >= 0 && diff <= days) out.push({ name: item.name, amount: Number(item.amount) || 0, date: ds, inDays: diff, kind, interval: item.interval });
      }
    };
    for (const c of (finances && finances.fixedCosts) || []) push(c, 'cost');
    for (const c of (finances && finances.income) || []) push(c, 'income');
    return out.sort((a, b) => a.date.localeCompare(b.date) || a.name.localeCompare(b.name));
  }
  function fmtMoney(n, currency = '€') {
    const v = Number(n) || 0;
    const s = v.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return `${s} ${currency}`;
  }

  // ---------- Aktivität / Feed ----------
  function activityByDay(data, today, days = 84) {
    const from = addDays(today, -(days - 1));
    const map = {};
    for (let i = 0; i < days; i++) { const d = addDays(from, i); map[d] = { date: d, workouts: 0, checkins: 0, milestones: 0, sessions: 0, score: 0 }; }
    const bump = (date, key, pts) => { const k = String(date || '').slice(0, 10); if (map[k]) { map[k][key]++; map[k].score += pts; } };
    for (const w of data.workouts || []) bump(w.date, 'workouts', workoutPoints(w));
    for (const c of data.checkins || []) bump(c.date, 'checkins', checkinPoints(c, data.settings));
    for (const m of data.milestones || []) if (m.done) bump(m.doneAt || m.due, 'milestones', milestonePoints(m));
    for (const s of data.sessions || []) bump(s.date, 'sessions', sessionPoints(s));
    for (const r of data.reviews || []) bump(r.date, 'sessions', reviewPoints(r));
    return Object.values(map);
  }

  function feed(data, limit = 12) {
    const items = [];
    for (const w of data.workouts || []) items.push({ kind: 'workout', date: w.date, title: `${w.type || 'Workout'} · ${w.minutes || 0} min`, detail: w.note || '', points: workoutPoints(w), ts: w.createdAt || w.date, photo: w.photo || null });
    for (const c of data.checkins || []) items.push({ kind: 'checkin', date: c.date, title: `Essens-Check-in · ${eatingScore(c, data.settings)}/10`, detail: c.note || '', points: checkinPoints(c, data.settings), ts: c.createdAt || c.date, photo: c.photo || null });
    for (const m of data.milestones || []) if (m.done) items.push({ kind: 'milestone', date: m.doneAt || m.due, title: m.title, detail: [CATEGORIES[m.category] || m.category, m.grade ? `Note ${m.grade}` : ''].filter(Boolean).join(' · '), points: milestonePoints(m), ts: m.doneAt || m.createdAt || m.due });
    for (const s of data.sessions || []) items.push({ kind: 'session', date: s.date, title: s.title, detail: s.summary || '', points: sessionPoints(s), ts: s.createdAt || s.date, photo: s.photo || null });
    for (const r of data.reviews || []) items.push({ kind: 'review', date: r.date, title: `Wochen-Check KW ${isoWeek(r.weekStart || r.date)}`, detail: r.focus ? 'Fokus: ' + r.focus : '', points: reviewPoints(r), ts: r.createdAt || r.date });
    items.sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')) || String(b.ts || '').localeCompare(String(a.ts || '')));
    return items.slice(0, limit);
  }

  // ---------- Gesamtübersicht (für Dashboard & CLI) ----------
  function summary(data, today = localDate()) {
    const settings = data.settings || {};
    const goal = Number(settings.weeklyWorkoutGoal) || 0;
    const pts = points(data);
    const thisWeek = workoutsInWeek(data.workouts, startOfWeek(today));
    const checkinDates = (data.checkins || []).map((c) => c.date);
    const todayCheckin = (data.checkins || []).find((c) => c.date === today) || null;
    const last7 = checkinSeries(data.checkins, settings, today, 7);
    return {
      today,
      points: pts,
      level: level(pts.total),
      workouts: {
        thisWeek: thisWeek.length,
        goal,
        minutesThisWeek: thisWeek.reduce((a, w) => a + (Number(w.minutes) || 0), 0),
        weekStreak: weeklyGoalStreak(data.workouts, goal, today),
        total: (data.workouts || []).length,
        series: weeklyWorkoutSeries(data.workouts, today, 8),
      },
      eating: {
        todayDone: !!todayCheckin,
        todayScore: todayCheckin ? eatingScore(todayCheckin, settings) : null,
        streak: dayStreak(checkinDates, today),
        avg7: average(last7.map((x) => x.score)),
        series14: checkinSeries(data.checkins, settings, today, 14),
      },
      milestones: {
        open: openMilestones(data.milestones),
        done: (data.milestones || []).filter((m) => m.done).length,
        uni: uniAverage(data.milestones),
      },
      finance: financeSummary(data.finances, today),
      review: reviewStatus(data.reviews, today),
      activity: activityByDay(data, today, 84),
      feed: feed(data, 12),
    };
  }

  return {
    localDate, parse, addDays, startOfWeek, monthKey, daysBetween, fmtDate, fmtDateShort, fmtMoney,
    CATEGORIES, INTERVALS, WORKOUT_TYPES, EXPENSE_CATEGORIES, LEVELS,
    workoutPoints, checkinPoints, milestonePoints, sessionPoints, reviewPoints, points, level, isoWeek, reviewStatus,
    workoutsInWeek, weeklyGoalStreak, weeklyWorkoutSeries,
    eatingScore, dayStreak, checkinSeries, average,
    uniAverage, openMilestones, monthlyAmount, financeSummary, upcoming, activityByDay, feed, summary,
  };
});
